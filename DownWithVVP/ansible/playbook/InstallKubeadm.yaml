- name: Preparation for installer modules kubernetes
  hosts: node1
  become: true
  tasks:
    - name: Settings validation packets
      ansible.builtin.script:
        cmd: ../../bash/Setting_vaidity_packet_ipv4.sh
      register: validation_pack
      changed_when: validation_pack != 0
