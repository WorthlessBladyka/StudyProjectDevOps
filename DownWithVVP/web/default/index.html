<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебный проект</title>
    <style>
        /* Общие стили */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-size: 16px;
            font-family: "PT Astra Sans", Arial, sans-serif;
            background-color: white;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Основной контент */
        main {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 4px;
        }
        
        /* Изображение */
        main img {
            width: 80%;
            height: auto;
            object-fit: contain;
        }
        
        /* Подвал */
        footer {
            text-align: center;
            padding: 25px;
            background-color: #f5f5f5;
            border-radius: 10px;
            border-top: 3px solid rgb(134, 98, 242);
        }
        
        footer p {
            margin-bottom: 10px;
        }
        
        footer p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body>
    <main>
        <img src="_resourses/404.png" alt="error 404">
    </main>
    
    <footer>
        <p>Сайт является частью учебного проекта.</p>
    </footer>
</body>
</html>
