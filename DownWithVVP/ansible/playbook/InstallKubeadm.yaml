- name: Install containerd
  hosts: node1
  become: true
  tasks:
    - name: Install
      ansible.builtin.script:
        cmd: ../../bash/install_and_check_containerD.sh
      register: installer
    - name: Debug containerd installer
      ansible.builtin.debug:
        msg: " debug installer {{ installer.stdout }}"
